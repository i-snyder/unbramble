name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release request
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run the Release workflow from main.'
          }
          [xml]$project = Get-Content ./src/UnBramble.Cli/UnBramble.Cli.csproj -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($projectVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Invalid project version '$projectVersion'. Use a stable version such as 0.2.0."
          }
          "RELEASE_VERSION=$projectVersion" >> $env:GITHUB_ENV
          $tag = "v$projectVersion"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether tag '$tag' already exists."
          }
          if ($existingTag) {
            throw "Tag '$tag' already exists; release tags are never reused."
          }
      - name: Build, test, publish, and smoke test
        shell: pwsh
        run: ./scripts/verify-all.ps1
      - name: Check product dependencies
        shell: pwsh
        run: dotnet package list --project UnBramble.sln --vulnerable --include-transitive
      - name: Package release
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag ./artifacts/unbramble-win-x64.zip ./artifacts/unbramble-win-x64.zip.sha256 --target $env:GITHUB_SHA --title "UnBramble $tag" --generate-notes --fail-on-no-commits
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed for $tag."
          }
