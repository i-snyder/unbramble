name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install .NET 8 runtime and .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build and test
        shell: pwsh
        run: ./scripts/verify-all.ps1 -SkipPublish
      - name: Check product dependencies
        shell: pwsh
        run: dotnet list UnBramble.sln package --vulnerable --include-transitive
