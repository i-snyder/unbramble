name: Verify release installation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitHub release version to test (e.g. 0.2.11)'
        required: true
        type: string
      winget_upgrade_from:
        description: 'Older published WinGet version to upgrade from (e.g. 0.2.9)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      winget_upgrade_from:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the release fixture and installation test
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify published ZIP and WinGet install, upgrade, and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          WINGET_UPGRADE_FROM: ${{ inputs.winget_upgrade_from }}
        run: |
          $stable = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          if ($env:RELEASE_VERSION -notmatch $stable -or $env:WINGET_UPGRADE_FROM -notmatch $stable -or [version]$env:WINGET_UPGRADE_FROM -ge [version]$env:RELEASE_VERSION) {
            throw 'Enter two stable release versions with the upgrade starting from the older version.'
          }
          ./scripts/verify-release-install.ps1 -Version $env:RELEASE_VERSION -PreviousVersion $env:WINGET_UPGRADE_FROM
      - name: Save verified WinGet manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifest-${{ inputs.version }}
          path: ${{ runner.temp }}/unbramble-release/candidate/manifests/i/i-snyder/unbramble/${{ inputs.version }}/*.yaml
          if-no-files-found: error
          retention-days: 3
