name: Proposal
description: Suggest an improvement or new capability.
title: "[proposal] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please discuss substantial work before opening a pull request. Don't attach proprietary Unity assets, credentials, absolute paths, company/vendor names, or unredacted logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete Unity or agent workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Idea
      description: What would make this better? A rough direction is enough.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Useful context
      description: Add examples, current workarounds, or synthetic serialization snippets if they help explain the request.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private project content, names, paths, credentials, and security-sensitive details.
          required: true
